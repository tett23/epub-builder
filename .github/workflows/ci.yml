name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr:
    name: ADR
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # ADR 0020：コミット済みの ADR はステータスの行のほかを変更できない
      - uses: tett23/adr-guard@v0.1.0
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  deno:
    name: Deno
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check
      - run: deno lint
      - run: deno task check
      - run: deno task test
      # ADR 0016：インストールしたコマンドが deno.json の依存を解決できること
      - name: Install the CLI
        run: |
          deno install -g -f --root "$RUNNER_TEMP/deno" --allow-read --allow-write --config deno.json -n epub-builder cli.ts
          "$RUNNER_TEMP/deno/bin/epub-builder" --version
          "$RUNNER_TEMP/deno/bin/epub-builder" check test/fixtures/sample-book -e all

  epubcheck:
    name: EPUBCheck
    runs-on: ubuntu-24.04
    env:
      EPUBCHECK_VERSION: 5.4.0
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Download EPUBCheck
        run: |
          curl -fsSL -o "$RUNNER_TEMP/epubcheck.zip" \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
      - run: deno task build:sample
      # ADR 0003：誤りも警告もないこと
      - name: Validate the fixtures
        run: |
          for epub in build/*.epub; do
            java -jar "$RUNNER_TEMP/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" --failonwarnings "$epub"
          done
